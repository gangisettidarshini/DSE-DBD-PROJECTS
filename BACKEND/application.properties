# ===================================================================
# CAPACITY CONNECT - Spring Boot Application Configuration
# Connects to MySQL Workbench / MySQL Server
# ===================================================================

server.port=8080
server.servlet.context-path=/api

# Database Configuration (MySQL Workbench / MySQL 8.0)
spring.datasource.url=jdbc:mysql://localhost:3306/capacity_connect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Multipart Limit
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging Configuration
logging.level.com.capacityconnect=INFO
logging.level.org.springframework.web=INFO
